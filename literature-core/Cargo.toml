[package]
name = "literature-core"
version = "0.1.0"
edition = "2021"
description = "Agent-first personal literature knowledge base core"
license = "MIT"
autobins = false

[[bin]]
name = "literature-core"
path = "src/main.rs"

[lib]
name = "literature_core"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
pdf-extract = "0.10"
regex = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
